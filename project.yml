name: DormRadar

options:
  bundleIdPrefix: com.righteous1776
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  DormRadar:
    type: application
    platform: iOS
    sources:
      - path: DormRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.righteous1776.DormRadar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: DormRadar uses Bluetooth to show anonymous nearby BLE activity.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"

  DormRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DormRadarTests
    dependencies:
      - target: DormRadar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DormRadar:
    build:
      targets:
        DormRadar: all
    test:
      targets:
        - DormRadarTests
