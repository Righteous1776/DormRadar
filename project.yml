name: DormRadar

options:
  bundleIdPrefix: com.righteous1776
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  DormRadar:
    type: application
    platform: iOS
    sources:
      - path: DormRadar
    info:
      path: DormRadar/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: DormRadar uses Bluetooth to show nearby BLE activity and alerts for devices you mark.
        NSMotionUsageDescription: DormRadar uses motion data to reduce ranging errors while the phone moves.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.righteous1776.DormRadar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "7"

  DormRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DormRadarTests
    dependencies:
      - target: DormRadar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DormRadar:
    build:
      targets:
        DormRadar: all
    test:
      targets:
        - DormRadarTests
